name: 1. Continuous Integration
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Decides whether the pull request touches anything that needs validation.
  # A trigger-level `paths-ignore` would leave the required `ci-ok` check
  # unreported on documentation-only pull requests and block them forever.
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changes that need validation
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            code=false
            # HEAD is the merge commit of the pull request; its first parent is the base branch.
            # Assigned on its own line so a failing diff fails the job instead of skipping validation.
            changed_files="$(git diff --name-only HEAD^1 HEAD)"
            while IFS= read -r file; do
              case "$file" in
                ''|*.md|docs/*|LICENSE|.gitignore|.vscode/*|.github/dependabot.yml|.github/workflows/cd.yml|.github/workflows/release.yml) ;;
                *) code=true; break ;;
              esac
            done <<< "$changed_files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  validate:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: cargo audit

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1.0

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Save Playwright browsers
        if: github.ref == 'refs/heads/main' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright OS dependencies
        run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build frontend
        run: pnpm build

      - name: Verify Tauri build (debug mode)
        run: pnpm tauri build --debug --no-bundle

  # The only check that should be marked as required: it always reports a result.
  ci-ok:
    needs: [changes, validate]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          echo "changes: $CHANGES_RESULT, validate: $VALIDATE_RESULT"
          [ "$CHANGES_RESULT" = "success" ] || exit 1
          [ "$VALIDATE_RESULT" = "success" ] || [ "$VALIDATE_RESULT" = "skipped" ] || exit 1
