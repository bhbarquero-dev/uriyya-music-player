name: Build and Test

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'
  ARTIFACT_RETENTION_DAYS: 7

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: ${{ env.PNPM_VERSION }}
    
    - name: Install dependencies
      run: pnpm install
    
    - name: Run linting
      run: pnpm lint:ci
    
    - name: Run tests
      run: pnpm test:ci
    
    - name: Get version
      id: version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

    - name: SonarQubeScan
      uses: SonarSource/sonarqube-scan-action@v6
      with:
        args: >
          -Dsonar.projectVersion=${{ steps.version.outputs.version }}
      env: 
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Upload test coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            run_make: true
            make_cmd: pnpm run make -- --platform=linux
          - os: windows-latest
            run_make: true
            make_cmd: pnpm run make -- --platform=win32
          - os: macos-latest
            run_make: true
            make_cmd: pnpm run make -- --platform=darwin --arch=universal
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install

      - name: Build application (renderer/main)
        run: pnpm run build

      - name: Run native packager (make)
        if: ${{ matrix.run_make }}
        run: ${{ matrix.make_cmd }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' && matrix.run_make }}
        with:
          name: electron-artifacts-${{ matrix.os }}
          path: out/make/**
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}