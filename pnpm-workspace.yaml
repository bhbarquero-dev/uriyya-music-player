allowBuilds:
  # Dependencias transitivas de @wdio/cli. Sus scripts de instalación descargan
  # drivers de navegador que esta suite no usa: tauri-driver lanza el driver
  # nativo y msedgedriver lo resuelve e2e-tauri/support/edgeDriver.js.
  edgedriver: false
  esbuild: true
  geckodriver: false

auditConfig:
  ignoreGhsas:
    - GHSA-jmr9-qjv8-65gv

onlyBuiltDependencies:
  - esbuild

overrides:
  postcss@<8.5.10: '>=8.5.10'
  serialize-javascript@<7.0.3: '>=7.0.3'
  deepmerge-ts@<8.0.0: '>=8.0.0'
